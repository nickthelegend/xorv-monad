# The Envio indexer: codegen, typecheck and the simulated-lifecycle tests.
# The tests feed synthetic events, so they need no HyperSync token.
name: indexer
on:
  push:
    branches: [main]
    paths: ["indexer/**", ".github/workflows/indexer.yml"]
  pull_request:
    paths: ["indexer/**"]
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: indexer
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --ignore-workspace --frozen-lockfile
      - run: pnpm codegen
      - run: pnpm exec tsc --noEmit
      - run: pnpm test
