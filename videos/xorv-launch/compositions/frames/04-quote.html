      /* ------------------------------------------------------------------

         TRIGGER 0.28 / EXIT_DUR 0.42 / OVERLAP 0.16 / ENTER_DUR 0.62 /

      ------------------------------------------------------------------ */
      const TRIGGER = 0.28;
      const EXIT_DUR = 0.42;
      const OVERLAP = 0.16;
      const EXIT_SCALE = 0.78;

      tl.fromTo(
        "#q04-legacy",
        { scale: 1, opacity: 1 },
        { scale: EXIT_SCALE, opacity: 0, duration: EXIT_DUR, ease: "power2.in" },
        TRIGGER,
      );

      tl.fromTo(
        "#q04-composer",
        { scale: EXIT_SCALE, opacity: 0 },
        { scale: 1, opacity: 1, duration: 0.62, ease: "back.out(1.5)" },
        TRIGGER + EXIT_DUR - OVERLAP,
      );

      // inner content reveals only once the container has settled
      const composerBits = [
        "#q04-chead",
        "#q04-placeholder",
        "#q04-picker",
        "#q04-submit-wrap",
      ];
      for (let i = 0; i < composerBits.length; i++) {
        tl.fromTo(
          composerBits[i],
          { opacity: 0, y: 12 },
          { opacity: 1, y: 0, duration: 0.44, ease: "power3.out" },
          TRIGGER + EXIT_DUR + 0.3 + i * 0.07,
        );
      }

      /* ------------------------------------------------------------------
         Scene 2 (1.6-3.4) -- "a buyer describes the work": the ask types on
         character-by-character behind a caret; ONE slow push-in underneath.
      ------------------------------------------------------------------ */
      const PROMPT = "Run my test suite and summarize the failures";
      const host = document.getElementById("q04-prompt");
      const chars = [];
      for (let i = 0; i < PROMPT.length; i++) {
        const s = document.createElement("span");
        s.className = "ch";
        s.textContent = PROMPT.charAt(i) === " " ? "\u00a0" : PROMPT.charAt(i);
        host.appendChild(s);
        chars.push(s);
      }

      tl.set("#q04-caret", { opacity: 1 }, 1.52);
      tl.set("#q04-placeholder", { opacity: 0 }, 1.56); // placeholder clear

      const TYPE_START = 1.6;
      const TYPE_END = 3.3;
      const step = (TYPE_END - TYPE_START) / chars.length;
      for (let i = 0; i < chars.length; i++) {
        tl.set(chars[i], { display: "inline" }, TYPE_START + i * step);
      }

      // camera: one slow push-in on the surface, decelerating to a hold
      tl.fromTo(
        "#q04-stage",
        { scale: 1 },
        { scale: 1.03, duration: 1.8, ease: "power1.inOut" },
        1.6,
      );

      // the caret blinks once on the finished ask, then goes out at the submit
      tl.set("#q04-caret", { opacity: 0 }, 3.34);
      tl.set("#q04-caret", { opacity: 1 }, 3.4);
      tl.set("#q04-caret", { opacity: 0 }, 3.46);

      /* ------------------------------------------------------------------
         Scene 3 (3.4-4.4) -- press-release-spring on the up-arrow submit.
         Linear compression, spring release, state continuity by adjacency
         (RELEASE_START = PRESS_START + PRESS_DUR). This system has no
         shadow, so the press reads through a colour dip plus a hairline
         release ring instead of a shadow shrink / radial burst.
      ------------------------------------------------------------------ */
      const PRESS_START = 3.44;
      const PRESS_DUR = 0.14;
      const RELEASE_START = PRESS_START + PRESS_DUR;

      tl.to(
        "#q04-submit",
        {
          scale: 0.92,
          backgroundColor: "#050505",
          duration: PRESS_DUR,
          ease: "power1.in",
        },
        PRESS_START,
      );
      tl.to(
        "#q04-submit",
        { scale: 1, backgroundColor: "#121212", duration: 0.5, ease: "back.out(1.8)" },
        RELEASE_START,
      );
      tl.fromTo(
        "#q04-burst",
        { scale: 1, opacity: 0 },
        { scale: 1.9, opacity: 0.5, duration: 0.34, ease: "power2.out" },
        RELEASE_START,
      );
      tl.to(
        "#q04-burst",
        { opacity: 0, duration: 0.34, ease: "power2.in" },
        RELEASE_START + 0.3,
      );

      // the composer hands the frame over -- dims to ~40%; the typed ask drops
      // further still so it cannot compete with the 402 that lands on top of it
      tl.to("#q04-composer", { opacity: 0.4, duration: 0.44, ease: "power2.inOut" }, 3.98);
      tl.to("#q04-promptline", { opacity: 0.3, duration: 0.44, ease: "power2.inOut" }, 3.98);
      tl.to("#q04-grid", { opacity: 0.45, duration: 0.44, ease: "power2.inOut" }, 3.98);

      /* ------------------------------------------------------------------
         Scene 4 (4.4-6.4) -- THE BEAT. 402 HARD-CUTS in at display scale over
         the dimmed composer and HOLDS ALONE. Nothing else arrives until 6.4.
      ------------------------------------------------------------------ */
      tl.set("#q04-402", { opacity: 1 }, 4.4); // hard cut -- deliberately not a tween
      tl.fromTo(
        "#q04-reason",
        { opacity: 0, y: 10 },
        { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" },
        4.74,
      );

      /* ------------------------------------------------------------------
         Scene 5 (6.4-8.8) -- 402 shrinks into a label and the terms resolve
         under it on "who will run it, and exactly what it costs".
      ------------------------------------------------------------------ */
      tl.to("#q04-402", { scale: 0.21, y: -164, duration: 0.72, ease: "power3.inOut" }, 6.4);
      tl.to(
        "#q04-reason",
        { scale: 0.8, y: -280, duration: 0.72, ease: "power3.inOut" },
        6.4,
      );
      tl.to("#q04-composer", { opacity: 0.12, duration: 0.5, ease: "power2.out" }, 6.42);

      tl.fromTo(
        "#q04-panel",
        { opacity: 0, y: 26, scale: 0.985 },
        { opacity: 1, y: 0, scale: 1, duration: 0.55, ease: "power3.out" },
        6.56,
      );

      // who will run it
      tl.fromTo(
        "#q04-lbl-provider",
        { opacity: 0, y: 14 },
        { opacity: 1, y: 0, duration: 0.42, ease: "power3.out" },
        6.94,
      );
      tl.fromTo(
        "#q04-provider",
        { opacity: 0, y: 14 },
        { opacity: 1, y: 0, duration: 0.42, ease: "power3.out" },
        7.02,
      );
      tl.fromTo(
        "#q04-provider-meta",
        { opacity: 0, y: 12 },
        { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" },
        7.14,
      );
      tl.fromTo("#q04-vdiv", { scaleY: 0 }, { scaleY: 1, duration: 0.45, ease: "power2.out" }, 7.24);

      // and exactly what it costs -- the only accent in the frame

        "#q04-lbl-price",
        { opacity: 0, y: 12 },
        { opacity: 1, y: 0, duration: 0.36, ease: "power3.out" },

      tl.fromTo(
