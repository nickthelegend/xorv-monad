      height: 1em;

    /* every token is pre-set and stacked; the cycle is an instant opacity swap

    .idle-clock-state {
      position: absolute;

      position: absolute;

    /* ---- layer 1 · the rule (self-drawn) + the used segment ---- */
    #idle-rule {

  <div data-hf-id="hf-2pc5" id="root" data-composition-id="01-idle" data-width="1920" data-height="1080">
    <!-- depth 0 — ground -->

    <!-- depth 1 — the hairline, drawn left to right -->
    <svg data-hf-id="hf-vb0f" id="idle-rule" class="clip" data-start="0" data-duration="4.6" data-track-index="1" viewBox="0 0 1920 2" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <line data-hf-id="hf-1hxa" id="idle-rule-line" x1="0" y1="1" x2="1920" y2="1" />
    </svg>

    <!-- depth 1 — the used segment of the day -->
    <div data-hf-id="hf-4im6" id="idle-fill" class="clip" data-start="0" data-duration="4.6" data-track-index="2"></div>

    <!-- depth 2 — chrome -->
    <div data-hf-id="hf-q43e" id="idle-clock" class="clip idle-mono" data-start="0" data-duration="4.6" data-track-index="3">
      <span data-hf-id="hf-ogek" class="idle-clock-state">09:14</span>
      <span data-hf-id="hf-wapq" class="idle-clock-state">13:02</span>
      <span data-hf-id="hf-l01v" class="idle-clock-state">17:41</span>
      <span data-hf-id="hf-klqu" class="idle-clock-state">17:42</span>
    </div>

    <div data-hf-id="hf-64qg" id="idle-price" class="clip idle-mono" data-start="0" data-duration="4.6" data-track-index="4">
      <span data-hf-id="hf-o5px" id="idle-price-mask"><span data-hf-id="hf-i6b6" id="idle-price-value">$200</span></span>
      <span data-hf-id="hf-4x6a" id="idle-price-unit">/ MONTH</span>
    </div>

    <div data-hf-id="hf-b4k8" id="idle-usage" class="clip idle-mono" data-start="0" data-duration="4.6" data-track-index="5">8%</div>

    <!-- depth 3 — the display moment -->
    <div data-hf-id="hf-j7ih" id="idle-word" class="clip" data-start="0" data-duration="4.6" data-track-index="6">
      <span data-hf-id="hf-lxk5" id="idle-word-text">idle</span>
    </div>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script>
    (function () {
      /* ONE tempo grid drives every beat (kinetic-beat-slam), laid on the real
         voice onsets of 01.wav:
           "every" 1.29 · "month," 1.76 · "most" 2.31 · "day" 2.81 · "idle" 3.42 */
      var PULSE = 0.42;
      function B(n) {
        return PULSE * n;
      }

      var tl = gsap.timeline({ paused: true });

      var ruleLine = document.getElementById("idle-rule-line");
      var clockStates = document.querySelectorAll("#idle-clock .idle-clock-state");

      /* ================= Scene 1 (0.00–1.26) — black, a rule, a clock ================= */

      /* svg-path-draw: measure the real geometry, never a magic number */
      var LEN = 1920;
      try {
        var measured = ruleLine.getTotalLength();
        if (measured && isFinite(measured) && measured > 0) LEN = measured;
      } catch (e) {}
      ruleLine.style.strokeDasharray = String(LEN);
      ruleLine.style.strokeDashoffset = String(LEN);

      /* constant-speed pen trace, left to right */
      tl.to(ruleLine, { strokeDashoffset: 0, duration: 1.05, ease: "none" }, B(0.25));

      /* the clock arrives — up and in (visible well inside 0.5s) */
      tl.fromTo(
        "#idle-clock",
        { y: 12, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.5, ease: "power3.out" },
        B(0.5)
      );

      /* ============ Scene 2 (1.26–3.36) — the price sets, the day runs ============ */

      /* "$200" sets in from under its mask — on "…every" */
      tl.fromTo(
        "#idle-price-value",
        { yPercent: 108 },
        { yPercent: 0, duration: 0.55, ease: "expo.out" },
        B(3)
      );

      /* "/ MONTH" lands on the spoken word "month," */
      tl.fromTo(
        "#idle-price-unit",
        { opacity: 0, x: -18 },
        { opacity: 1, x: 0, duration: 0.45, ease: "circ.out" },
        B(4.25)
      );

      /* ============ the clock — in-place token cycle (discrete-text-sequence) ========
         Instant state swaps at thresholds; no roll, no scroll, no blur.
         Working day on "most of the day", then one quiet digit tick in the hold.
         Swaps are zero-duration property sets, NOT callbacks — the engine seeks
         frame-by-frame with events suppressed, so an onUpdate would never fire. */
      var CLOCK_AT = [
        0, /* 09:14 */
        B(5.5), /* 13:02 — "most"          */
        B(6.75), /* 17:41 — "day"           */
        B(10.25) /* 17:42 — the hold's only motion */
      ];

      /* build-time initial state — tl.set() defaults to immediateRender:false,
         so frame 0 must be painted directly, not left to the timeline */
      gsap.set(clockStates, { opacity: 0 });
      gsap.set(clockStates[0], { opacity: 1 });

      tl.set(clockStates[0], { opacity: 1 }, 0);
      for (var i = 1; i < CLOCK_AT.length; i++) {
        tl.set(clockStates[i], { opacity: 0 }, 0);
      }
      for (var j = 1; j < CLOCK_AT.length; j++) {
        tl.set(clockStates[j - 1], { opacity: 0, immediateRender: false }, CLOCK_AT[j]);
        tl.set(clockStates[j], { opacity: 1, immediateRender: false }, CLOCK_AT[j]);
      }

      /* ================= Scene 3 (3.36–4.31) — idle, and the 8% ================= */

      /* HARD CUT — the word is simply there. Sub-frame fade so the state is
         unambiguous on a backward seek; reads as a cut at any frame rate. */
      tl.fromTo(
        "#idle-word-text",
        { opacity: 0 },
        { opacity: 1, duration: 0.008, ease: "none" },
        B(8)
      );

      /* The slam: the word snaps tight on the hit — no blur, no slide.
         Originally a letterSpacing tween, which is a layout property: it snaps
         to integer device pixels, so the ease-out tail stutters under the
         seek-by-frame capture engine. scaleX reads as the same tightening and
         runs on the compositor, where sub-pixel values survive. */
      tl.fromTo(
        "#idle-word-text",
        { scaleX: 1.035 },
        { scaleX: 1, duration: 0.24, ease: "expo.out", transformOrigin: "50% 50%" },
        B(8)
      );

      /* stat-bars-and-fills: scaleX from a left origin, stops at 8% */
      tl.fromTo(
        "#idle-fill",
        { scaleX: 0 },
        { scaleX: 0.08, duration: 0.7, ease: "power2.out" },
        B(8.5)
      );

      tl.fromTo(
        "#idle-usage",
        { opacity: 0 },
        { opacity: 1, duration: 0.3, ease: "power1.out" },
        B(9.5)
      );

      /* ============ Scene 4 (4.31–4.60) — holds still. No camera, no breath. ========
         The clock's last tick already landed. Pin the timeline to the frame's full
         4.6s so the held state IS the tail, rather than the timeline ending early. */
      tl.set(
        clockStates[CLOCK_AT.length - 1],
        { opacity: 1, immediateRender: false },
        4.6
      );

      /* ---------------------------------------------------------------
         Hand off to frame 2, which opens on "idle" alone. Everything that
         does not survive the cut leaves before it, so the seam carries one
         element across instead of dropping three. */
      tl.to(
        ["#idle-clock", "#idle-price", "#idle-usage", "#idle-fill", "#idle-rule"],
        { opacity: 0, duration: 0.42, ease: "power2.inOut" },
        4.06
      );

      window.__timelines = window.__timelines || {};
      window.__timelines["01-idle"] = tl;
    })();
  </script>
