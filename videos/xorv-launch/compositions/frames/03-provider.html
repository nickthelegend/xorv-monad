  <script>
    (function () {
      var DUR = 8.2;

      /* real strings the product prints */
      var CMD1 = "npm i -g @xorv/cli";
      var CMD2 = "xorv start";

      /* type-on windows + caret windows (blueprint: typewriter-reveal) */
      var T1S = 1.8,
        T1E = 2.44,
        C1_ON = 1.05,
        C1_OFF = 2.62;
      var T2S = 2.78,
        T2E = 3.14,
        C2_ON = 2.72,
        C2_OFF = 3.24;
      var BLINK = 0.62; /* one cycle per 0.62s */

      var q = function (id) {
        return document.getElementById(id);
      };
      var t1 = q("f03-provider-t1"),
        t2 = q("f03-provider-t2");
      var c1 = q("f03-provider-c1"),
        c2 = q("f03-provider-c2");

      function slice(s, t, a, b) {
        if (t <= a) return "";
        if (t >= b) return s;
        return s.slice(0, Math.floor(((t - a) / (b - a)) * s.length));
      }

      var drv = { t: 0 };
      function paint(t) {
        t1.textContent = slice(CMD1, t, T1S, T1E);
        t2.textContent = slice(CMD2, t, T2S, T2E);
        /* deterministic square-wave blink — no CSS animation, seek-safe */
        var on = Math.sin((t / BLINK) * Math.PI * 2) > 0 ? 1 : 0;
        var typing1 = t >= T1S && t < T1E;
        var typing2 = t >= T2S && t < T2E;
        c1.style.opacity = t >= C1_ON && t < C1_OFF ? (typing1 ? 1 : on) : 0;
        c2.style.opacity = t >= C2_ON && t < C2_OFF ? (typing2 ? 1 : on) : 0;
      }
      paint(0);

      window.__timelines = window.__timelines || {};
      var tl = gsap.timeline({ paused: true });

      /* ── Scene 1 (0.0–1.8): the split collapses inward, the terminal rises ── */
      tl.fromTo(
        "#f03-provider-grid",
        { opacity: 0 },
        { opacity: 1, duration: 0.9, ease: "power2.out" },
        0.1,
      );

      tl.fromTo(
        "#f03-provider-sl",
        { x: -340, opacity: 1 },
        { x: 0, duration: 0.4, ease: "power4.in" },
        0,
      );
      tl.fromTo(
        "#f03-provider-sr",
        { x: 340, opacity: 1 },
        { x: 0, duration: 0.4, ease: "power4.in" },
        0,
      );
      tl.fromTo(
        "#f03-provider-sc",
        { scaleY: 1, opacity: 1 },
        { scaleY: 0.04, opacity: 0, duration: 0.4, ease: "power4.in" },
        0,
      );
      /* the three lines meet on one column and hand the frame to the terminal */
      tl.to(
        ["#f03-provider-sl", "#f03-provider-sr"],
        { opacity: 0, duration: 0.06, ease: "none" },
        0.36,
      );

      tl.fromTo(
        "#f03-provider-term",
        { y: 62, scale: 0.82, opacity: 0, filter: "blur(14px)" },
        {
          y: 0,
          scale: 1,
          opacity: 1,
          filter: "blur(0px)",
          duration: 0.78,
          ease: "expo.out",
        },
        0.36,
      );
      /* macro push underneath — stops before the Scene 5 hold */
      tl.to(
        "#f03-provider-term",
        { scale: 1.012, duration: 5.4, ease: "none" },
        1.2,
      );

      tl.fromTo(
        "#f03-provider-chrome",
        { opacity: 0 },
        { opacity: 1, duration: 0.32, ease: "power2.out" },
        0.78,
      );
      /* the prompt lands and its caret starts blinking */
      tl.fromTo(
        "#f03-provider-cmd1",
        { opacity: 0 },
        { opacity: 1, duration: 0.26, ease: "power2.out" },
        0.95,
      );

      /* ── Scene 2 (1.8–3.2): the two commands type on with the caret ──────── */
      /* The type-on + caret blink ride a `modifiers` driver rather than
         `onUpdate`: modifiers run inside GSAP's render pass, so they still fire
         when the renderer seeks with events suppressed. */
      tl.to(
        drv,
        {
          t: DUR,
          duration: DUR,
          ease: "none",
          modifiers: {
            t: function (v) {
              paint(parseFloat(v));
              return v;
            },
          },
        },
        0,
      );
      tl.fromTo(
        "#f03-provider-cmd2",
        { opacity: 0 },
        { opacity: 1, duration: 0.16, ease: "none" },
        2.66,
      );

      /* ── Scenes 3/4/5: the doctor lines resolve ONE PER BEAT ──────────────
         Each line prints as a left-to-right wipe, then its ✔ resolves a beat
         later — a list building, never a dump. */
      var LINES = [
        { line: "#f03-provider-l1", mark: "#f03-provider-m1", at: 3.3 },
        { line: "#f03-provider-l2", mark: "#f03-provider-m2", at: 5.04 },
        { line: "#f03-provider-l3", mark: "#f03-provider-m3", at: 6.62 },
      ];
      for (var i = 0; i < LINES.length; i++) {
        tl.fromTo(
          LINES[i].line,
          { clipPath: "inset(0% 100% 0% 0%)", opacity: 0 },
          {
            clipPath: "inset(0% 0% 0% 0%)",
            opacity: 1,
            duration: 0.32,
            ease: "power2.out",
          },
          LINES[i].at,
        );
        tl.fromTo(
          LINES[i].mark,
          { opacity: 0, scale: 0.34 },
          { opacity: 1, scale: 1, duration: 0.3, ease: "back.out(2.2)" },
          LINES[i].at + 0.4,
        );
      }

      window.__timelines["03-provider"] = tl;
    })();
