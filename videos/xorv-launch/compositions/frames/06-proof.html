  <script>
    (function () {
      var TXN = "0.0.9842030@1785527147.476758713";
      var DIGITS = "0123456789";

      /* ---------- build the decode row (mono, so widths never move) ---------- */
      var txnEl = document.getElementById("proof-txn");
      var charEls = [];
      var slots = "";
      for (var s = 0; s < TXN.length; s++) {
        var sc = TXN.charAt(s);
        /* digits become empty slots; "." and "@" stay, so the id's exact
           shape is legible before any value is */
        slots += sc >= "0" && sc <= "9" ? "·" : sc;
      }
      document.getElementById("proof-slots").textContent = slots;

      var FLICKS = 3; /* decoy glyphs each digit cycles before it locks */

      for (var i = 0; i < TXN.length; i++) {
        var ch = TXN.charAt(i);
        /* only the digits scramble — the "." and "@" hold the id's shape
           from the first frame, so the structure is never in doubt */
        var isDigit = ch >= "0" && ch <= "9";

        var cell = document.createElement("span");
        cell.className = "proof-char";

        var real = document.createElement("span");
        real.className = "proof-r";
        real.textContent = ch;
        cell.appendChild(real);

        var decoys = [];
        if (isDigit) {
          for (var g = 0; g < FLICKS; g++) {
            var decoy = document.createElement("span");
            decoy.className = "proof-g";
            decoy.textContent = pseudoGlyph(i, g);
            cell.appendChild(decoy);
            decoys.push(decoy);
          }
        }

        txnEl.appendChild(cell);
        charEls.push({ cell: cell, real: real, decoys: decoys });
      }

      /* index + quantised-progress seeded — the same frame always yields
         the same glyph (deterministic; no Math.random, no Date.now) */
      function pseudoGlyph(i, step) {
        var h = (i + 1) * 2654435761 + (step + 1) * 40503;
        h = ((h % 2147483647) * 48271) % 2147483647;
        return DIGITS.charAt(h % 10);
      }

      /* ---------- build the consensus stream ---------- */
      var WIDTHS = [318, 246, 372, 204, 290, 348, 232, 300, 264, 384, 218, 336];
      var scol = document.getElementById("proof-scol");
      var streamRows = [];
      for (var r = 0; r < WIDTHS.length; r++) {
        var row = document.createElement("div");
        row.className = "proof-srow";
        row.style.top = r * 34 + "px";
        var tick = document.createElement("i");
        tick.className = "proof-tick";
        var bar = document.createElement("i");
        bar.className = "proof-bar";
        bar.style.width = WIDTHS[r] + "px";
        row.appendChild(tick);
        row.appendChild(bar);
        scol.appendChild(row);
        streamRows.push(row);
      }

      /* ---------------------------------------------------------------- */
      window.__timelines = window.__timelines || {};
      var tl = gsap.timeline({ paused: true });

      var card = document.getElementById("proof-card");

      /* ---- Scene 1 (0.0–1.6s) — the axis lifts away, the receipt rises ---- */
      tl.fromTo(
        "#proof-axis",
        { y: 0, scaleX: 1, opacity: 1 },
        { y: -304, scaleX: 0.889583, opacity: 0.56, duration: 0.9, ease: "power3.inOut" },
        0,
      );
      tl.fromTo(
        card,
        { y: 46, scale: 0.985 },
        { y: 0, scale: 1, duration: 0.95, ease: "power3.out" },
        0.08,
      );
      tl.fromTo(card, { opacity: 0 }, { opacity: 1, duration: 0.4, ease: "power1.out" }, 0.08);

      /* HEDERA TESTNET sets small, upper-right, and stays for the whole frame */
      tl.fromTo(
        "#proof-badge",
        { opacity: 0, x: 16 },
        { opacity: 1, x: 0, duration: 0.5, ease: "power3.out" },
        0.34,
      );
      tl.fromTo(
        "#proof-dot",
        { opacity: 0, scale: 0.3 },
        { opacity: 1, scale: 1, duration: 0.34, ease: "power3.out" },
        0.62,
      );
      tl.fromTo(
        "#proof-meta",
        { opacity: 0, y: 8 },
        { opacity: 1, y: 0, duration: 0.45, ease: "power3.out" },
        0.74,
      );
      /* the empty id slots state the length before the value exists */
      tl.fromTo(
        "#proof-slots",
        { opacity: 0 },
        { opacity: 1, duration: 0.5, ease: "power2.out" },
        0.94,
      );

      /* ---- Scene 2 (1.6–3.6s) — the id decodes character by character ----
         One LINEAR tween per char; the power3.out flap curve is computed from
         it. Driving the glyph off eased progress would crush the whole flicker
         phase into the first ~4 frames of the flip. */
      var DECODE_AT = 1.62;
      var FLIP = 0.68;
      var STAGGER = 0.0303;
      var LOCK_IN = FLIP * 0.6; /* the real glyph clicks in at 60% of the flip */
      var STEP = LOCK_IN / FLICKS; /* 0.136s per decoy — ~4 frames at 30fps */

      charEls.forEach(function (c, i) {
        var at = DECODE_AT + i * STAGGER;

        /* the flap — hinged at the bottom edge, through the line's perspective */
        tl.fromTo(
          c.cell,
          { rotationX: 90 },
          { rotationX: 0, duration: FLIP, ease: "power3.out", transformOrigin: "50% 100%" },
          at,
        );
        tl.fromTo(
          c.cell,
          { opacity: 0 },
          { opacity: 1, duration: FLIP * 0.5, ease: "power1.out" },
          at,
        );

        /* reset every glyph state at 0 so any seek lands on the right frame */
        tl.set(c.decoys.concat([c.real]), { opacity: 0 }, 0);
        for (var g = 0; g < c.decoys.length; g++) {
          tl.set(c.decoys[g], { opacity: 1 }, at + g * STEP);
          tl.set(c.decoys[g], { opacity: 0 }, at + (g + 1) * STEP);
        }
        /* separators were never secret — they read from the first frame */
        tl.set(c.real, { opacity: 1 }, c.decoys.length ? at + LOCK_IN : at);
      });

      /* the slots hand off to the real characters as the decode sweeps
         across them (a within-scene swap, not an exit) */
      tl.fromTo(
        "#proof-slots",
        { opacity: 1 },
        { opacity: 0, duration: 0.12, ease: "none", immediateRender: false },
        1.66,
      );

      /* the lock: the line takes the weight and the rule snaps across */
      tl.fromTo(
        "#proof-txn",
        { y: -6 },
        { y: 0, duration: 0.38, ease: "power4.out", immediateRender: false },
        3.22,
      );
      tl.fromTo(
        "#proof-rule",
        { scaleX: 0 },
        { scaleX: 1, duration: 0.46, ease: "power4.out" },
        3.24,
      );

      /* ---- Scene 3 (3.6–5.8s) — one row per word ---- */
      for (var n = 0; n < 3; n++) {
        var at = 3.62 + n * 0.66;
        tl.fromTo(
          "#proof-k" + n,
          { opacity: 0, y: 12 },
          { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" },
          at,
        );
        tl.fromTo(
          "#proof-v" + n,
          { opacity: 0, y: 12 },
          { opacity: 1, y: 0, duration: 0.44, ease: "power3.out" },
          at + 0.07,
        );
      }

      /* ---- Scene 4 (5.8–8.8s) — reframe, the receipts topic arrives ---- */
      /* card carries leftward; the topic enters from the right on the same
         path and decelerates into place (cut-the-curve, no cut) */
      tl.fromTo(
        card,
        { x: 0 },
        { x: -274, duration: 0.74, ease: "power3.inOut", immediateRender: false },
        5.8,
      );
      tl.fromTo(
        "#proof-topic",
        { opacity: 0, x: 96 },
        { opacity: 1, x: 0, duration: 0.66, ease: "power4.out" },
        6.02,
      );
      tl.fromTo(
        "#proof-tlabel",
        { opacity: 0, y: 10 },
        { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" },
        6.3,
      );
      tl.fromTo(
        "#proof-tid",
        { opacity: 0, y: 14 },
        { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" },
        6.46,
      );
      tl.fromTo(
        "#proof-trule",
        { scaleX: 0 },
        { scaleX: 1, duration: 0.5, ease: "power4.out" },
        6.62,
      );

      /* the scroll keeps running under the hold — the subject is doing
         something, so the frame is never frozen */
      tl.fromTo("#proof-scol", { y: 0 }, { y: -96, duration: 2.1, ease: "none" }, 6.7);
      streamRows.forEach(function (el, i) {
        tl.fromTo(

          { opacity: 1, duration: 0.3, ease: "power2.out" },
          6.72 + i * 0.13,
        );
      });

      /* full-span anchor so the sub-composition timeline covers the window */
      tl.to({}, { duration: 8.8 }, 0);

      window.__timelines["06-proof"] = tl;
    })();
