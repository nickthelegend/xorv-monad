  <script>
    (function () {
      var ID = "08-cta";
      var root = document.querySelector('[data-composition-id="' + ID + '"]');
      if (!root) return;
      var q = function (sel) {
        return root.querySelector(sel);
      };
      var qa = function (sel) {
        return Array.prototype.slice.call(root.querySelectorAll(sel));
      };

      /* ---------------------------------------------------------------
         Scene 1 (0.0–1.4s)  hairlines rotate + converge into the grid;
                             the wordmark assembles out of the cross.
         Scene 2 (1.4–2.8s)  the two mono lines resolve.
         Scene 3 (2.8–4.0s)  the accent dot lands and pulses ONCE.
         Scene 4 (4.0–5.5s)  absolutely still. no fade, no push.
         --------------------------------------------------------------- */

      var gridwrap = q("#f08cta-gridwrap");
      var leadH = q("#f08cta-leadh");
      var leadV = q("#f08cta-leadv");
      var wordClip = q("#f08cta-wordclip-rect");
      var wordEl = q("#f08cta-word");
      var pen = q("#f08cta-pen");
      var rule = q("#f08cta-rule");
      var cmdText = q("#f08cta-cmdtext");
      var urlText = q("#f08cta-urltext");
      var live = q("#f08cta-live");
      var dotCore = q("#f08cta-dotcore");
      var dotRing = q("#f08cta-dotring");


      /* the wipe travels the wordmark's real glyph extent, measured — a fixed travel
         would finish the reveal a third of the way through the tween */
      var WORD_X0 = 74;
      var wbox = null;
      try {
        wbox = wordEl.getBBox();
      } catch (e) {
        wbox = null;
      }
      var WORD_X1 = wbox && wbox.width > 20 ? Math.min(wbox.x + wbox.width + 6, 258) : 172;

      /* ---- mono resolve: a pure function of timeline time, so every seek is exact ---- */
      var CMD = "npm i -g @xorv/cli";
      var SITE = "xorv.vercel.app";
      var GLYPHS = "#$%&*+=/?~^!|:;";
      var CMD_IN = 1.6,
        CMD_OUT = 2.26;
      var URL_IN = 2.34,
        URL_OUT = 2.8;

      function prog(t, a, b) {
        return t <= a ? 0 : t >= b ? 1 : (t - a) / (b - a);
      }
      function resolveText(full, p, head) {
        if (p >= 1) return full;
        var n = full.length;
        var front = p * (n + head);
        var out = "";
        for (var i = 0; i < n; i++) {
          var c = full.charAt(i);
          if (i < front - head) out += c;
          else if (i < front && c !== " ")
            out += GLYPHS.charAt((i * 5 + Math.floor(p * 61)) % GLYPHS.length);
          else out += " ";
        }
        return out;
      }
      var clock = { t: 0 };
      function paint() {
        cmdText.textContent = resolveText(CMD, prog(clock.t, CMD_IN, CMD_OUT), 3);
        urlText.textContent = resolveText(SITE, prog(clock.t, URL_IN, URL_OUT), 2);
      }
      paint();

      /* Explicit t=0 states, applied at mount: the frame is correct on the very first
         paint, before the host has seeked anything. Every entrance below is still a
         fromTo, so any seek — forward or backward — resolves to the same values. */
      gsap.set(gridwrap, {
        opacity: 0.5,
        rotation: -7,
        scale: 1.12,
        transformOrigin: "960px 540px",
      });
      gsap.set(leadH, { opacity: 0, rotation: 9, transformOrigin: "930px 0px" });
      gsap.set(leadV, { opacity: 0, rotation: -9, transformOrigin: "0px 704px" });
      gsap.set(pen, { opacity: 0 });
      gsap.set(rule, { scaleX: 0, transformOrigin: "50% 50%" });
      gsap.set(live, { opacity: 0 });
      gsap.set(dotCore, { scale: 0, svgOrigin: "20 20" });
      gsap.set(dotRing, { opacity: 0 });

      window.__timelines = window.__timelines || {};
      var tl = gsap.timeline({ paused: true });

      /* ---------------- Scene 1 — the grid converges, the mark assembles ---------------- */

      tl.fromTo(
        gridwrap,
        { rotation: -7, scale: 1.12, opacity: 0.5 },
        {
          rotation: 0,
          scale: 1,
          opacity: 1,
          duration: 0.9,
          ease: "power3.out",
          transformOrigin: "960px 540px",
        },
        0,
      );

      tl.fromTo(
        leadH,
        { rotation: 9, opacity: 0 },
        {
          rotation: 0,
          opacity: 1,
          duration: 0.7,
          ease: "power3.out",
          transformOrigin: "930px 0px",
        },
        0,
      );
      tl.fromTo(
        leadV,
        { rotation: -9, opacity: 0 },
        {
          rotation: 0,
          opacity: 1,
          duration: 0.7,
          ease: "power3.out",
          transformOrigin: "0px 704px",
        },
        0,
      );
      /* they stop being lead lines and become two lines of the grid */
      tl.to(leadH, { opacity: 0.34, duration: 0.5, ease: "power1.out" }, 0.72);
      tl.to(leadV, { opacity: 0.34, duration: 0.5, ease: "power1.out" }, 0.72);


      /* the wordmark is written out by a hairline pen riding the reveal edge */
      tl.fromTo(
        wordClip,
        { attr: { width: 0 } },
        { attr: { width: WORD_X1 - WORD_X0 }, duration: 0.38, ease: "power2.out" },
        1.02,
      );
      tl.fromTo(
        pen,
        { attr: { x: WORD_X0 } },
        { attr: { x: WORD_X1 }, duration: 0.38, ease: "power2.out" },
        1.02,
      );
      /* belt and braces: whatever the measurement, the wordmark is whole once the wipe lands */
      tl.set(wordClip, { attr: { width: 190 } }, 1.4);
      tl.fromTo(pen, { opacity: 0 }, { opacity: 0.9, duration: 0.06, ease: "none" }, 1.02);
      tl.to(pen, { opacity: 0, duration: 0.14, ease: "power1.out" }, 1.3);

      /* ---------------- Scene 2 — the machine lines resolve ---------------- */

      tl.fromTo(
        rule,
        { scaleX: 0 },
        { scaleX: 1, duration: 0.5, ease: "power3.out", transformOrigin: "50% 50%" },
        1.36,
      );

      /* one clock drives both resolves; the strings are a pure function of its time */
      tl.to(clock, { t: 2.86, duration: 2.86, ease: "none", onUpdate: paint }, 0);

      /* ---------------- Scene 3 — the one accent, one pulse ---------------- */

      tl.fromTo(live, { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "power1.out" }, 2.86);

      tl.fromTo(
        dotCore,
        { scale: 0 },
        { scale: 1, duration: 0.26, ease: "back.out(2.2)", svgOrigin: "20 20" },
        2.96,
      );
      /* the single pulse — up once, back once, then it rests for good */
      tl.to(dotCore, { scale: 1.45, duration: 0.16, ease: "power2.out", svgOrigin: "20 20" }, 3.24);
      tl.to(dotCore, { scale: 1, duration: 0.34, ease: "power2.inOut", svgOrigin: "20 20" }, 3.4);
      /* the ring's visibility is its own fromTo, so the rest state either side of the
         pulse is opacity 0 — a `from: 0.85` would sit on screen for the whole lead-in */
      tl.fromTo(dotRing, { opacity: 0 }, { opacity: 0.85, duration: 0.05, ease: "none" }, 3.24);
      tl.fromTo(
        dotRing,
        { attr: { r: 6 } },
        { attr: { r: 19 }, duration: 0.72, ease: "power2.out" },
        3.24,
      );
      tl.to(dotRing, { opacity: 0, duration: 0.63, ease: "power2.out" }, 3.33);

      /* ---------------- Scene 4 — nothing. the frame holds on black. ---------------- */

      window.__timelines[ID] = tl;
    })();
  </script>
