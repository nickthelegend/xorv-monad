        ticks = el("ticks"),

      window.__timelines = window.__timelines || {};

      /* ============ SCENE 1 — vo "They sign." (0.06–1.12) ============
         The quote row holds motionless, then extends into the full-width
         hairline ledger axis; the provider id migrates onto its node. */

      tl.fromTo(chrome, { opacity: 0 }, { opacity: 1, duration: 0.55, ease: "power1.out" }, 0.12);

      // the row becomes the rule — the axis grows outward from where the row sat
      tl.fromTo(
        axisInner,
        { scaleX: 0, transformOrigin: "50% 50%" },
        { scaleX: 1, duration: 0.8, ease: "power2.inOut" },
        0.18,
      );
      tl.fromTo(
        axisL,
        { scaleX: 0, transformOrigin: "100% 50%" },
        { scaleX: 1, duration: 0.55, ease: "power2.out" },
        0.58,
      );

        axisR,
        { scaleX: 0, transformOrigin: "0% 50%" },
        { scaleX: 1, duration: 0.55, ease: "power2.out" },
        0.58,
      );

      // "pays →" is not part of the ledger. The id is.
      tl.to(pays, { opacity: 0, duration: 0.36, ease: "power1.in" }, 0.26);
      tl.fromTo(
        providerId,
        { x: -630, y: 92, scale: 0.7059, transformOrigin: "50% 50%" },
        { x: 0, y: 0, scale: 1, duration: 0.88, ease: "power2.inOut" },
        0.28,
      );

      tl.fromTo(stripRule, { opacity: 0 }, { opacity: 1, duration: 0.65, ease: "power1.out" }, 0.48);
      tl.fromTo(
        buyerId,
        { opacity: 0, y: 14 },
        { opacity: 1, y: 0, duration: 0.46, ease: "power2.out" },
        0.6,
      );
      tl.fromTo(
        buyerRole,
        { opacity: 0, y: 10 },
        { opacity: 1, y: 0, duration: 0.42, ease: "power2.out" },
        0.74,
      );
      tl.fromTo(
        providerRole,
        { opacity: 0, y: 10 },
        { opacity: 1, y: 0, duration: 0.42, ease: "power2.out" },
        0.8,
      );
      tl.fromTo(
        buyerNode,
        { opacity: 0, scale: 0.6, transformOrigin: "50% 50%" },
        { opacity: 1, scale: 1, duration: 0.32, ease: "power3.out" },
        0.88,
      );
      tl.fromTo(
        providerNode,
        { opacity: 0, scale: 0.6, transformOrigin: "50% 50%" },
        { opacity: 1, scale: 1, duration: 0.32, ease: "power3.out" },
        0.94,
      );
      tl.fromTo(ticks, { opacity: 0 }, { opacity: 1, duration: 0.6, ease: "power1.out" }, 0.98);
      tl.fromTo(
        [buyerBal, buyerSub],
        { opacity: 0, y: 10 },
        { opacity: 1, y: 0, duration: 0.42, ease: "power2.out" },
        1.0,
      );

      /* ====== SCENE 2 — vo "It settles in about 3 seconds" (1.19–3.08) ======
         0.2500 USDC departs the buyer and travels the rule; beneath it a
         value-scaled counter paces the travel 0.0s → 3.0s, landing the count
         on the word "seconds". */

      tl.fromTo(
        token,
        { opacity: 0, scale: 0.92, transformOrigin: "50% 50%" },
        { opacity: 1, scale: 1, duration: 0.26, ease: "power2.out" },
        1.22,
      );
      tl.fromTo(elapsed, { opacity: 0 }, { opacity: 1, duration: 0.38, ease: "power1.out" }, 1.3);
      tl.fromTo(counter, { opacity: 0 }, { opacity: 1, duration: 0.34, ease: "power1.out" }, 1.32);

      var TRAVEL = 1.7;
      var TRAVEL_EASE = "power2.inOut";

      tl.fromTo(token, { x: 0 }, { x: 1000, duration: TRAVEL, ease: TRAVEL_EASE }, 1.42);
      tl.fromTo(
        trace,
        { scaleX: 0, transformOrigin: "0% 50%" },
        { scaleX: 1, duration: TRAVEL, ease: TRAVEL_EASE },
        1.42,
      );

      // counting-dynamic-scale: value + transform scale, same position, same ease.
      // The value is a ladder of zero-duration sets, not an onUpdate callback —
      // the renderer seeks frame-by-frame and suppresses callbacks; sets render.
      var travelEase = gsap.parseEase(TRAVEL_EASE);
      var i, p;
      for (i = 0; i <= 51; i++) {
        p = i / 51;
        tl.set(
          counter,
          { innerText: (travelEase(p) * 3).toFixed(1) + "s" },
          1.42 + p * TRAVEL,
        );
      }
      tl.fromTo(
        counter,
        { scale: 0.55, transformOrigin: "50% 50%" },
        { scale: 1, duration: TRAVEL, ease: TRAVEL_EASE },
        1.42,
      );

      /* ====== SCENE 3 — vo "in USDC" (3.08–4.48), then
                            "straight to the provider," (4.68–6.16) ======
         The amount lands on "USDC"; the destination lands on "provider". */

      tl.to(token, { scale: 1.045, duration: 0.1, ease: "power2.out" }, 3.12);
      tl.to(token, { scale: 1, duration: 0.22, ease: "power2.inOut" }, 3.22);
      tl.fromTo(
        providerBal,
        { opacity: 0, y: 8 },
        { opacity: 1, y: 0, duration: 0.3, ease: "power2.out" },
        3.2,
      );

      var balEase = gsap.parseEase("power2.out");
      for (i = 0; i <= 26; i++) {
        p = i / 26;
        tl.set(
          providerValue,
          { innerText: (balEase(p) * 0.25).toFixed(4) + " USDC" },
          3.26 + p * 0.85,
        );
      }

      // the elapsed record settles back so the gas beat can own the frame
      tl.to(counterBlock, { opacity: 0.45, duration: 0.5, ease: "power1.inOut" }, 4.55);

      // "…provider," — the node goes live and the ledger marks it settled
      tl.fromTo(
        providerFill,
        { scale: 0, transformOrigin: "50% 50%" },
        { scale: 1, duration: 0.3, ease: "power3.out" },
        5.45,
      );
      tl.fromTo(
        providerSub,
        { opacity: 0, y: 8 },
        { opacity: 1, y: 0, duration: 0.4, ease: "power2.out" },
        5.62,
      );

      /* ====== SCENE 4 — THE USP BEAT ======
         vo "and the buyer never touched HBAR" (6.32–8.88)
         vo "Hedera's facilitator"             (8.88–10.12)
         A third line labelled gas reaches for the BUYER, is refused, reverses,
         and re-anchors to the facilitator. Three distinct moments. */

      // the gas leaves the transaction
      tl.fromTo(
